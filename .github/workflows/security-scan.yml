name: Security scans
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install and verify scanners
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanners"
          cd "$RUNNER_TEMP/scanners"
          curl --fail --location --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check --strict
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          curl --fail --location --retry 3 -O https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          curl --fail --location --retry 3 -O https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_SHA256SUMS
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum --check --strict
          chmod +x gitleaks osv-scanner_linux_amd64
          echo "$RUNNER_TEMP/scanners" >> "$GITHUB_PATH"
      - name: Scan tracked source and history for secrets
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --redact --no-banner --config .gitleaks.toml .
          gitleaks dir --redact --no-banner --config .gitleaks.toml .
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Resolve exact Maven dependency versions
        run: |
          set -euo pipefail
          mvn -B -f apps/server-java/pom.xml -DskipTests package dependency:tree -DoutputType=tgf -DoutputFile=target/dependencies.tgf
          python3 scripts/maven-sbom.py apps/server-java/target/dependencies.tgf output/maven-sbom.cdx.json
      - name: Scan locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          osv-scanner_linux_amd64 scan source --no-resolve --lockfile package-lock.json --sbom output/maven-sbom.cdx.json
